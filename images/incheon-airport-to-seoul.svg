<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Illustration of three routes from an airport to Seoul: train, bus and taxi" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe8ff"/><stop offset="1" stop-color="#fff3d6"/></linearGradient></defs>
<rect width="1200" height="750" fill="url(#sky)"/>
<circle cx="1000" cy="150" r="70" fill="#ffd166"/>
<path d="M0 520 L150 400 L300 500 L470 360 L640 500 L800 420 L1000 520 L1200 440 V750 H0Z" fill="#b7d3c2"/>
<rect x="0" y="560" width="1200" height="190" fill="#4b5563"/>
<rect x="0" y="640" width="1200" height="10" fill="#fbbf24"/>
<g fill="#e5e7eb"><rect x="60" y="700" width="90" height="8"/><rect x="260" y="700" width="90" height="8"/><rect x="460" y="700" width="90" height="8"/><rect x="660" y="700" width="90" height="8"/><rect x="860" y="700" width="90" height="8"/><rect x="1060" y="700" width="90" height="8"/></g>
<!-- train -->
<g transform="translate(70 380)"><rect width="380" height="120" rx="40" fill="#0052a4"/><rect x="30" y="25" width="70" height="42" rx="8" fill="#dbeafe"/><rect x="120" y="25" width="70" height="42" rx="8" fill="#dbeafe"/><rect x="210" y="25" width="70" height="42" rx="8" fill="#dbeafe"/><rect x="300" y="25" width="50" height="42" rx="8" fill="#dbeafe"/><rect y="88" width="380" height="10" fill="#00a84d"/><circle cx="90" cy="125" r="16" fill="#111827"/><circle cx="290" cy="125" r="16" fill="#111827"/></g>
<text x="260" y="350" text-anchor="middle" font-family="Albert Sans,Arial,sans-serif" font-size="34" font-weight="800" fill="#0052a4">AREX train</text>
<!-- bus -->
<g transform="translate(500 470)"><rect width="300" height="120" rx="18" fill="#00a84d"/><rect x="20" y="20" width="60" height="40" rx="6" fill="#ecfdf5"/><rect x="95" y="20" width="60" height="40" rx="6" fill="#ecfdf5"/><rect x="170" y="20" width="60" height="40" rx="6" fill="#ecfdf5"/><rect x="245" y="20" width="40" height="70" rx="6" fill="#ecfdf5"/><circle cx="70" cy="122" r="18" fill="#111827"/><circle cx="230" cy="122" r="18" fill="#111827"/></g>
<text x="650" y="445" text-anchor="middle" font-family="Albert Sans,Arial,sans-serif" font-size="34" font-weight="800" fill="#047857">Airport bus</text>
<!-- taxi -->
<g transform="translate(850 520)"><path d="M0 70 L30 20 H170 L210 70 H250 V110 H0Z" fill="#fbbf24"/><path d="M45 28 H100 V68 H30Z M110 28 H165 L190 68 H110Z" fill="#e0f2fe"/><rect x="90" y="4" width="70" height="18" rx="4" fill="#111827"/><circle cx="60" cy="112" r="17" fill="#111827"/><circle cx="195" cy="112" r="17" fill="#111827"/></g>
<text x="975" y="495" text-anchor="middle" font-family="Albert Sans,Arial,sans-serif" font-size="34" font-weight="800" fill="#b45309">Taxi</text>
<text x="600" y="110" text-anchor="middle" font-family="Albert Sans,Arial,sans-serif" font-size="54" font-weight="800" fill="#111827">Airport to Seoul: three ways</text>
</svg>
