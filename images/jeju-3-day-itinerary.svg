<g fill="none" stroke="#fff" stroke-width="4" opacity=".55" stroke-linecap="round"><path d="M60 560q30-18 60 0t60 0t60 0"/><path d="M520 640q30-18 60 0t60 0t60 0"/><path d="M880 560q30-18 60 0t60 0t60 0"/><path d="M250 690q30-18 60 0t60 0t60 0"/></g>
