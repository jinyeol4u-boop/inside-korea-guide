<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Jeju island scene: a snow-capped volcano, a green sunrise cone by the sea, a tangerine grove and a black stone wall">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB88C"/><stop offset=".55" stop-color="#FFE3B8"/><stop offset="1" stop-color="#FFF6E6"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3FB1D6"/><stop offset="1" stop-color="#1B6AA5"/></linearGradient>
<linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6D8F7A"/><stop offset="1" stop-color="#3F7A58"/></linearGradient>
<linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FD16B"/><stop offset="1" stop-color="#4FA45A"/></linearGradient>
</defs>
<rect width="1200" height="750" fill="url(#sky)"/>
<circle cx="900" cy="250" r="78" fill="#FF7A3D"/>
<circle cx="900" cy="250" r="115" fill="#FF7A3D" opacity=".18"/>
<g fill="#fff" opacity=".92"><ellipse cx="180" cy="120" rx="95" ry="26"/><ellipse cx="255" cy="104" rx="62" ry="24"/><ellipse cx="760" cy="90" rx="85" ry="22"/><ellipse cx="1040" cy="140" rx="70" ry="20"/></g>
