<rect x="600" y="675" width="600" height="75" fill="#FFFFFF"/>
<rect x="880" y="540" width="26" height="140" rx="8" fill="#6B4A33"/>
<path d="M893 430 L830 560 H956z" fill="#2E8B6A"/><path d="M893 480 L815 620 H971z" fill="#2E8B6A"/>
<path d="M893 430 L866 486 H920z" fill="#FFFFFF"/><path d="M893 480 L850 560 H936z" fill="#FFFFFF" opacity="0.9"/>
<g fill="#FFFFFF" stroke="#9CC4E4" stroke-width="2"><circle cx="680" cy="440" r="9"/><circle cx="760" cy="500" r="7"/><circle cx="1020" cy="450" r="9"/><circle cx="1100" cy="530" r="7"/><circle cx="700" cy="590" r="8"/><circle cx="1060" cy="620" r="8"/><circle cx="980" cy="410" r="6"/></g>
