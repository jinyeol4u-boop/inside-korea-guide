<linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf7ee"/><stop offset="1" stop-color="#d6efe0"/></linearGradient></defs>
<rect width="1200" height="750" fill="url(#sky)"/>
