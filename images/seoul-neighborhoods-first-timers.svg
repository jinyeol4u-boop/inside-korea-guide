<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Illustration of Seoul neighborhoods: a hanok roof, a hill tower, shopping street, modern towers and subway line">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD9A8"/><stop offset="0.55" stop-color="#FFB7C5"/><stop offset="1" stop-color="#BFA8FF"/></linearGradient>
</defs>
<rect width="1200" height="750" fill="url(#sky)"/>
<circle cx="960" cy="150" r="80" fill="#FFF3C4"/>
<path d="M0 470 Q200 330 400 450 T800 430 T1200 460 V750 H0Z" fill="#7DC9A0"/>
<path d="M0 520 Q250 420 520 500 T1200 500 V750 H0Z" fill="#4FAE86"/>
<!-- N tower on hill -->
<rect x="560" y="170" width="14" height="190" fill="#5B4B8A"/>
<ellipse cx="567" cy="250" rx="34" ry="14" fill="#7C6BC4"/>
<ellipse cx="567" cy="300" rx="22" ry="9" fill="#7C6BC4"/>
<rect x="564" y="130" width="6" height="50" fill="#5B4B8A"/>
<!-- hanok -->
<g transform="translate(90 330)">
<rect x="20" y="90" width="260" height="110" fill="#F4E4C8"/>
<rect x="40" y="110" width="50" height="90" fill="#8C5A3C"/><rect x="115" y="110" width="50" height="90" fill="#8C5A3C"/><rect x="190" y="110" width="50" height="90" fill="#8C5A3C"/>
<path d="M-20 100 Q150 20 320 100 L290 118 Q150 60 10 118Z" fill="#3E3A58"/>
<path d="M-20 100 Q-5 112 10 118" fill="none" stroke="#3E3A58" stroke-width="6"/>
</g>
<!-- shopping street -->
<g transform="translate(430 400)">
<rect x="0" y="40" width="80" height="150" fill="#FF6F91"/><rect x="85" y="10" width="70" height="180" fill="#FFC857"/><rect x="160" y="60" width="80" height="130" fill="#6EC6FF"/>
<g fill="#fff" opacity="0.85"><rect x="12" y="60" width="18" height="18"/><rect x="45" y="60" width="18" height="18"/><rect x="12" y="100" width="18" height="18"/><rect x="45" y="100" width="18" height="18"/><rect x="98" y="30" width="18" height="18"/><rect x="125" y="30" width="18" height="18"/><rect x="98" y="75" width="18" height="18"/><rect x="125" y="75" width="18" height="18"/><rect x="175" y="80" width="18" height="18"/><rect x="205" y="80" width="18" height="18"/></g>
<path d="M0 40 L40 15 L80 40Z" fill="#C2406A"/>
</g>
<!-- modern towers -->
<g transform="translate(780 260)">
<rect x="0" y="80" width="70" height="330" fill="#3FA7A0"/><rect x="85" y="0" width="80" height="410" fill="#2F7FBF"/><rect x="180" y="130" width="70" height="280" fill="#7C6BC4"/>
<g fill="#E8F7FF" opacity="0.8"><rect x="12" y="100" width="14" height="14"/><rect x="40" y="100" width="14" height="14"/><rect x="12" y="150" width="14" height="14"/><rect x="40" y="150" width="14" height="14"/><rect x="100" y="30" width="14" height="14"/><rect x="132" y="30" width="14" height="14"/><rect x="100" y="90" width="14" height="14"/><rect x="132" y="90" width="14" height="14"/><rect x="100" y="150" width="14" height="14"/><rect x="132" y="150" width="14" height="14"/><rect x="195" y="155" width="14" height="14"/><rect x="225" y="155" width="14" height="14"/></g>
</g>
<!-- river -->
<path d="M0 650 Q300 610 600 650 T1200 640 V750 H0Z" fill="#4C8DFF"/>
<!-- subway line -->
<path d="M70 600 H1130" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
<path d="M70 600 H1130" stroke="#00A84D" stroke-width="8" stroke-linecap="round"/>
<g fill="#fff" stroke="#00A84D" stroke-width="6"><circle cx="170" cy="600" r="16"/><circle cx="400" cy="600" r="16"/><circle cx="640" cy="600" r="16"/><circle cx="880" cy="600" r="16"/><circle cx="1050" cy="600" r="16"/></g>
</svg>
