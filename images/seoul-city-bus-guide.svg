<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Illustration of a blue and a green city bus on a Seoul street with a bus stop sign and a transit card tapping a reader">
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe8ff"/><stop offset="1" stop-color="#fff1d6"/></linearGradient></defs>
<rect width="1200" height="750" fill="url(#sky)"/>
<circle cx="1040" cy="120" r="62" fill="#ffd166"/>
<g fill="#a5bbd8"><rect x="60" y="300" width="90" height="270"/><rect x="160" y="230" width="110" height="340"/><rect x="280" y="330" width="80" height="240"/><rect x="900" y="280" width="100" height="290"/><rect x="1010" y="340" width="130" height="230"/></g>
<g fill="#fff"><rect x="185" y="260" width="16" height="16"/><rect x="225" y="260" width="16" height="16"/><rect x="185" y="305" width="16" height="16"/><rect x="225" y="305" width="16" height="16"/><rect x="925" y="310" width="16" height="16"/><rect x="965" y="310" width="16" height="16"/></g>
<rect x="0" y="570" width="1200" height="180" fill="#4b5563"/>
<rect x="0" y="575" width="1200" height="8" fill="#e5e7eb"/>
<g fill="#e5e7eb"><rect x="60" y="690" width="100" height="8"/><rect x="360" y="690" width="100" height="8"/><rect x="660" y="690" width="100" height="8"/><rect x="960" y="690" width="100" height="8"/></g>
<!-- blue bus -->
<g transform="translate(120 380)">
<rect width="520" height="210" rx="28" fill="#1d4ed8"/>
<rect x="0" y="120" width="520" height="30" fill="#1e40af"/>
<g fill="#dbeafe"><rect x="30" y="30" width="80" height="70" rx="8"/><rect x="125" y="30" width="80" height="70" rx="8"/><rect x="220" y="30" width="80" height="70" rx="8"/><rect x="315" y="30" width="80" height="70" rx="8"/></g>
<rect x="415" y="22" width="80" height="140" rx="8" fill="#bfdbfe"/>
<rect x="30" y="160" width="460" height="10" fill="#93c5fd"/>
<circle cx="120" cy="215" r="36" fill="#1f2937"/><circle cx="120" cy="215" r="16" fill="#9ca3af"/>
<circle cx="400" cy="215" r="36" fill="#1f2937"/><circle cx="400" cy="215" r="16" fill="#9ca3af"/>
<rect x="190" y="-26" width="140" height="30" rx="6" fill="#111827"/><text x="260" y="-5" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="middle">402</text>
</g>
<!-- green bus -->
<g transform="translate(690 430) scale(.8)">
<rect width="460" height="190" rx="26" fill="#16a34a"/>
<rect x="0" y="110" width="460" height="28" fill="#15803d"/>
<g fill="#dcfce7"><rect x="28" y="28" width="72" height="64" rx="8"/><rect x="112" y="28" width="72" height="64" rx="8"/><rect x="196" y="28" width="72" height="64" rx="8"/><rect x="280" y="28" width="72" height="64" rx="8"/></g>
<rect x="368" y="20" width="72" height="126" rx="8" fill="#bbf7d0"/>
<circle cx="110" cy="195" r="32" fill="#1f2937"/><circle cx="110" cy="195" r="14" fill="#9ca3af"/>
<circle cx="350" cy="195" r="32" fill="#1f2937"/><circle cx="350" cy="195" r="14" fill="#9ca3af"/>
<rect x="160" y="-24" width="130" height="28" rx="6" fill="#111827"/><text x="225" y="-4" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fbbf24" text-anchor="middle">7016</text>
</g>
<!-- bus stop -->
<g transform="translate(60 360)">
<rect x="40" y="0" width="10" height="220" fill="#6b7280"/>
<rect x="0" y="0" width="90" height="60" rx="10" fill="#fff" stroke="#6b7280" stroke-width="4"/>
<circle cx="45" cy="30" r="16" fill="#ef4444"/>
</g>
<!-- card reader -->
<g transform="translate(850 110)">
<rect width="230" height="180" rx="24" fill="#111827"/>
<rect x="20" y="20" width="190" height="60" rx="10" fill="#34d399"/>
<text x="115" y="60" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#064e3b" text-anchor="middle">1,500 won</text>
<g transform="translate(40 105) rotate(-8)"><rect width="150" height="90" rx="12" fill="#f59e0b"/><rect x="14" y="16" width="34" height="26" rx="5" fill="#fde68a"/><rect x="14" y="60" width="90" height="8" rx="4" fill="#fde68a"/></g>
</g>
</svg>
