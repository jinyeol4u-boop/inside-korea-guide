<rect width="1200" height="750" fill="url(#sky)"/>
<circle cx="600" cy="110" r="58" fill="#ffd166"/>
<path d="M0 440 Q200 340 400 410 T800 400 T1200 420 V600 H0Z" fill="#cfe6d6"/>
