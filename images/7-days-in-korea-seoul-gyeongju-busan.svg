<g fill="#4b5563"><rect x="740" y="500" width="20" height="24" rx="3"/></g>
<g fill="#f4a261"><circle cx="680" cy="290" r="16"/></g><path d="M660 270 q20 -22 40 0" stroke="#e76f51" stroke-width="5" fill="none"/>
