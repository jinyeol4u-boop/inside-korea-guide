<path d="M850 540 H1200" stroke="#374151" stroke-width="12"/>
<g fill="#ffffff" opacity=".85"><path d="M900 650 q40 -22 80 0 q-40 14 -80 0Z"/><path d="M1060 695 q40 -22 80 0 q-40 14 -80 0Z"/></g>
