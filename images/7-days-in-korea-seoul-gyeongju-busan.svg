<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Illustration of a high-speed train passing a Seoul tower skyline, a Silla royal tomb mound and stone tower, and a Busan harbor bridge by the sea">
