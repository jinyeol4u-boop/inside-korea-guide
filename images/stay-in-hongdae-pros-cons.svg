<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Illustration of a lively street stage with a guitarist, microphone and string lights beside a small guesthouse and a cafe under a purple evening sky">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A2A6B"/><stop offset="0.6" stop-color="#B45AA8"/><stop offset="1" stop-color="#FF9A8B"/></linearGradient>
<linearGradient id="stage" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD43B"/><stop offset="1" stop-color="#FF7A9A"/></linearGradient>
</defs>
<rect width="1200" height="750" fill="url(#sky)"/>
<g fill="#fff"><circle cx="110" cy="80" r="4"/><circle cx="270" cy="140" r="3"/><circle cx="470" cy="60" r="4"/><circle cx="700" cy="110" r="3"/><circle cx="880" cy="70" r="4"/><circle cx="1090" cy="150" r="3"/></g>
<circle cx="1010" cy="130" r="46" fill="#FFF3B0"/>
<circle cx="1030" cy="116" r="42" fill="#3A2A6B" opacity=".3"/>
<!-- back buildings -->
<g fill="#5B3F8F"><rect x="30" y="330" width="130" height="300"/><rect x="170" y="280" width="100" height="350"/><rect x="940" y="300" width="110" height="330"/><rect x="1060" y="350" width="140" height="280"/></g>
<g fill="#FFD43B" opacity=".85"><rect x="50" y="360" width="22" height="26" rx="3"/><rect x="95" y="360" width="22" height="26" rx="3"/><rect x="50" y="420" width="22" height="26" rx="3"/><rect x="190" y="320" width="22" height="26" rx="3"/><rect x="230" y="380" width="22" height="26" rx="3"/><rect x="965" y="340" width="22" height="26" rx="3"/><rect x="1005" y="400" width="22" height="26" rx="3"/><rect x="1085" y="390" width="22" height="26" rx="3"/></g>
<!-- guesthouse -->
<rect x="70" y="400" width="250" height="230" rx="8" fill="#F7F1E8"/>
<rect x="70" y="400" width="250" height="36" rx="8" fill="#00A84D"/>
<g fill="#7AD0C0"><rect x="100" y="460" width="50" height="44" rx="4"/><rect x="240" y="460" width="50" height="44" rx="4"/></g>
<g fill="#FFD43B"><rect x="170" y="460" width="50" height="44" rx="4"/></g>
<rect x="150" y="540" width="90" height="90" rx="6" fill="#3A2A6B"/>
<g transform="translate(135 408)"><rect x="0" y="14" width="90" height="8" rx="3" fill="#fff"/><rect x="0" y="6" width="7" height="22" rx="2" fill="#fff"/><rect x="11" y="8" width="24" height="10" rx="4" fill="#fff"/><rect x="84" y="14" width="6" height="14" rx="2" fill="#fff"/></g>
<!-- cafe -->
<rect x="860" y="470" width="230" height="160" rx="8" fill="#FFE8D6"/>
<path d="M845 470 H1105 L1085 425 H865 Z" fill="#E4572E"/>
<g fill="#fff"><path d="M865 425 h40 v45 h-40z" opacity=".35"/><path d="M945 425 h40 v45 h-40z" opacity=".35"/><path d="M1025 425 h40 v45 h-40z" opacity=".35"/></g>
<rect x="885" y="510" width="80" height="70" rx="4" fill="#7AD0C0"/>
<rect x="985" y="520" width="75" height="110" rx="4" fill="#3A2A6B"/>
<g transform="translate(905 525)"><path d="M0 0 h38 v22 a19 19 0 0 1 -38 0z" fill="#fff"/><path d="M38 4 h8 a7 7 0 0 1 0 14 h-8" fill="none" stroke="#fff" stroke-width="4"/></g>
<!-- stage -->
<rect x="400" y="470" width="400" height="30" rx="6" fill="url(#stage)"/>
<rect x="400" y="500" width="400" height="130" fill="#6A4C93"/>
<rect x="400" y="500" width="400" height="10" fill="#FF3D71"/>
<g fill="#fff" opacity=".25"><rect x="430" y="530" width="30" height="80" rx="4"/><rect x="480" y="530" width="30" height="80" rx="4"/><rect x="530" y="530" width="30" height="80" rx="4"/><rect x="580" y="530" width="30" height="80" rx="4"/><rect x="630" y="530" width="30" height="80" rx="4"/><rect x="680" y="530" width="30" height="80" rx="4"/><rect x="730" y="530" width="30" height="80" rx="4"/></g>
<!-- stage lights -->
<g><path d="M440 300 L470 470 L410 470 Z" fill="#FFD43B" opacity=".25"/><path d="M760 300 L790 470 L730 470 Z" fill="#7AD0C0" opacity=".25"/></g>
<rect x="395" y="285" width="410" height="14" rx="6" fill="#2B2150"/>
<g><circle cx="440" cy="306" r="12" fill="#FFD43B"/><circle cx="600" cy="306" r="12" fill="#FF3D71"/><circle cx="760" cy="306" r="12" fill="#7AD0C0"/></g>
<!-- performer -->
