<circle cx="40" cy="20" r="22" fill="#FFCDA8"/>
<path d="M16 14 q24 -34 48 0 q-10 -8 -24 -8 q-14 0 -24 8z" fill="#2B2150"/>
<path d="M10 52 q30 -18 60 0 l8 76 h-76z" fill="#FF3D71"/>
<rect x="20" y="124" width="16" height="48" rx="6" fill="#2B2150"/><rect x="44" y="124" width="16" height="48" rx="6" fill="#2B2150"/>
<!-- guitar -->
<g transform="rotate(-20 40 100)"><ellipse cx="34" cy="118" rx="28" ry="22" fill="#E4572E"/><circle cx="34" cy="118" r="8" fill="#2B2150"/><rect x="54" y="96" width="70" height="8" rx="3" fill="#8C5E3C"/><rect x="118" y="92" width="16" height="16" rx="3" fill="#2B2150"/></g>
</g>
<!-- microphone -->
<g transform="translate(680 380)"><rect x="-2" y="40" width="4" height="90" fill="#2B2150"/><rect x="-18" y="124" width="36" height="6" rx="3" fill="#2B2150"/><rect x="-10" y="6" width="20" height="38" rx="10" fill="#fff"/><rect x="-10" y="20" width="20" height="4" fill="#2B2150" opacity=".4"/></g>
<!-- music notes -->
<g fill="#fff" opacity=".9"><path d="M500 400 v-40 l30 -8 v40" fill="none" stroke="#fff" stroke-width="5"/><circle cx="494" cy="402" r="9"/><circle cx="524" cy="394" r="9"/><path d="M730 420 v-34 l24 -6 v34" fill="none" stroke="#fff" stroke-width="5"/><circle cx="724" cy="422" r="8"/><circle cx="748" cy="416" r="8"/></g>
<!-- crowd silhouettes -->
<g fill="#2B2150"><circle cx="440" cy="650" r="20"/><rect x="418" y="668" width="44" height="60" rx="14"/><circle cx="520" cy="660" r="20"/><rect x="498" y="678" width="44" height="60" rx="14"/><circle cx="640" cy="652" r="20"/><rect x="618" y="670" width="44" height="60" rx="14"/><circle cx="730" cy="660" r="20"/><rect x="708" y="678" width="44" height="60" rx="14"/></g>
<!-- street -->
<rect x="0" y="630" width="1200" height="120" fill="#3A2A6B" opacity=".55"/>
<rect x="0" y="630" width="1200" height="8" fill="#FF7A9A"/>
<!-- string lights -->
<path d="M0 230 Q300 300 600 240 T1200 250" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/>
<g><circle cx="90" cy="257" r="12" fill="#FF3D71"/><circle cx="220" cy="272" r="12" fill="#FFD43B"/><circle cx="360" cy="270" r="12" fill="#7AD0C0"/><circle cx="500" cy="262" r="12" fill="#FF3D71"/><circle cx="700" cy="250" r="12" fill="#FFD43B"/><circle cx="850" cy="252" r="12" fill="#7AD0C0"/><circle cx="1000" cy="258" r="12" fill="#FF3D71"/><circle cx="1130" cy="256" r="12" fill="#FFD43B"/></g>
</svg>
