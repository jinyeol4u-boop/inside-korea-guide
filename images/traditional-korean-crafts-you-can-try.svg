<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Illustration of a craft table with a paper lantern, a knotted tassel, a mother-of-pearl box and a ceramic bowl">
<rect width="1200" height="750" fill="#FFF3E0"/>
<circle cx="1060" cy="110" r="75" fill="#FFD966"/><circle cx="120" cy="120" r="90" fill="#FBE0E6"/>
<rect x="0" y="520" width="1200" height="230" fill="#E7D3B0"/>
<rect x="0" y="520" width="1200" height="22" fill="#C9A874"/>
<!-- hanji lantern -->
<g transform="translate(250 140)">
<line x1="100" y1="0" x2="100" y2="60" stroke="#6B4A2B" stroke-width="6"/>
<rect x="60" y="55" width="80" height="16" rx="6" fill="#8C2F1E"/>
<path d="M50 71 Q0 190 50 310 H150 Q200 190 150 71z" fill="#FFE9B8" stroke="#E4572E" stroke-width="6"/>
<path d="M50 140 H150 M42 200 H158 M50 262 H150" stroke="#E4572E" stroke-width="5" fill="none"/>
<path d="M100 71 V310" stroke="#E4572E" stroke-width="4"/>
