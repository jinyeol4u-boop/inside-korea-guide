<title id="t">A hillside Korean temple with two stone pagodas, a mountain grotto and a small bus</title>
<desc id="d">Colorful illustration of a Korean Buddhist temple with tiled roofs and two stone pagodas in a courtyard, a forested mountain behind with a small domed grotto near the peak, a winding road and a bus, with the sun rising over the sea.</desc>
