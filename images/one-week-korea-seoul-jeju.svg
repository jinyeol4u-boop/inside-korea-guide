<g fill="#FFD27A" opacity=".9"><rect x="55" y="380" width="12" height="14"/><rect x="80" y="410" width="12" height="14"/><rect x="135" y="345" width="12" height="14"/><rect x="155" y="400" width="12" height="14"/><rect x="490" y="365" width="12" height="14"/><rect x="520" y="420" width="12" height="14"/><rect x="570" y="405" width="12" height="14"/></g>
