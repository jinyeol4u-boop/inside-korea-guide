<ellipse cx="392" cy="300" rx="26" ry="12" fill="#F4F4F4"/>
<rect x="390" y="262" width="4" height="40" fill="#E94F4F"/>
<!-- palace roof -->
<path d="M240 440 Q320 380 400 440 L420 440 Q330 360 230 440 Z" fill="#2E3B55"/>
<path d="M210 450 Q320 360 430 450 L440 470 L200 470 Z" fill="#3E7C6B"/>
