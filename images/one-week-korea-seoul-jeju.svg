<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Split scene: a Seoul skyline with a palace roof and tower on the left, an airplane crossing the sky, and Jeju's volcano and sea on the right">
<defs>
