<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38B6D8"/><stop offset="1" stop-color="#1B6AA5"/></linearGradient>
<linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6D8F7A"/><stop offset="1" stop-color="#3F7A58"/></linearGradient>
</defs>
<rect width="1200" height="750" fill="url(#sky)"/>
<circle cx="600" cy="130" r="64" fill="#FFC857"/>
<g fill="#fff" opacity=".95"><ellipse cx="170" cy="110" rx="90" ry="24"/><ellipse cx="240" cy="94" rx="58" ry="22"/><ellipse cx="900" cy="170" rx="86" ry="22"/><ellipse cx="1030" cy="120" rx="64" ry="20"/></g>
