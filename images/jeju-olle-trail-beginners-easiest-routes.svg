<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t d">
<title id="t">A coastal walking path with trail arrows on Jeju Island</title>
<desc id="d">A winding path along the sea past stone walls and a small volcanic cone, with blue and orange arrow signs, a walker silhouette and a bright sun.</desc>
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a5d8ff"/><stop offset="1" stop-color="#fff1cf"/></linearGradient></defs>
<rect width="1200" height="750" fill="url(#sky)"/>
<circle cx="1000" cy="140" r="70" fill="#ffd166"/>
<g fill="#fff" opacity=".9"><ellipse cx="250" cy="130" rx="95" ry="30"/><ellipse cx="320" cy="115" rx="60" ry="26"/><ellipse cx="640" cy="200" rx="80" ry="24"/></g>
<rect y="330" width="1200" height="120" fill="#38bdf8"/>
<path d="M0 360 Q150 340 300 360 T600 360 T900 360 T1200 360" stroke="#e0f2fe" stroke-width="6" fill="none"/>
<path d="M0 400 Q150 380 300 400 T600 400 T900 400 T1200 400" stroke="#e0f2fe" stroke-width="5" fill="none" opacity=".8"/>
<path d="M600 450 L760 450 Q800 330 880 330 Q960 330 1000 450 L1200 450 L1200 460 L600 460Z" fill="#7c5a3a"/>
<path d="M740 450 Q790 300 880 300 Q970 300 1020 450Z" fill="#5b8c3a"/>
<path d="M830 322 Q880 300 930 322 Q880 340 830 322Z" fill="#3f6b28"/>
<rect y="450" width="1200" height="300" fill="#86c26a"/>
<path d="M-20 700 C200 620 330 700 520 620 C700 540 760 600 900 540 C1000 500 1100 520 1230 480" stroke="#f1e0b8" stroke-width="64" fill="none" stroke-linecap="round"/>
<path d="M-20 700 C200 620 330 700 520 620 C700 540 760 600 900 540 C1000 500 1100 520 1230 480" stroke="#e0c98e" stroke-width="6" fill="none" stroke-dasharray="26 26"/>
<g fill="#4b5563"><rect x="40" y="520" width="90" height="40" rx="8"/><rect x="140" y="510" width="80" height="50" rx="8"/><rect x="230" y="525" width="100" height="36" rx="8"/><rect x="340" y="515" width="70" height="46" rx="8"/><rect x="420" y="528" width="90" height="34" rx="8"/></g>
<g fill="#6b7280"><rect x="60" y="530" width="30" height="12" rx="4"/><rect x="170" y="525" width="30" height="12" rx="4"/><rect x="260" y="535" width="30" height="12" rx="4"/></g>
<!-- sign -->
<g transform="translate(250 560)"><rect x="-6" y="0" width="12" height="120" fill="#6b4a2b"/><rect x="-60" y="-70" width="120" height="64" rx="10" fill="#fff"/><path d="M-40 -38 H20 L8 -52 M20 -38 L8 -24" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
<g transform="translate(980 540)"><rect x="-6" y="0" width="12" height="110" fill="#6b4a2b"/><rect x="-60" y="-70" width="120" height="64" rx="10" fill="#fff"/><path d="M40 -38 H-20 L-8 -52 M-20 -38 L-8 -24" stroke="#f97316" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
<!-- walker -->
<g transform="translate(620 600)" fill="#1f2937"><circle cx="0" cy="-70" r="14"/><rect x="-12" y="-54" width="24" height="46" rx="10" fill="#ef4444"/><rect x="-10" y="-8" width="9" height="42" rx="4"/><rect x="2" y="-8" width="9" height="42" rx="4"/><rect x="-26" y="-50" width="12" height="36" rx="5" fill="#ef4444"/></g>
<text x="600" y="95" text-anchor="middle" font-family="Albert Sans,Arial,sans-serif" font-size="56" font-weight="800" fill="#111827">Walk Jeju one route at a time</text>
</svg>
